[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = src

[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    bblanchon/ArduinoJson@^7.3.0
    lovyan03/LovyanGFX@^1.1.12
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.f_cpu = 240000000L
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

[env:esp32-s3-devkitc-1]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps = ${common.lib_deps}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}
board_build.flash_mode = ${common.board_build.flash_mode}
board_build.f_flash = ${common.board_build.f_flash}
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.psram_type = ${common.board_build.psram_type}
board_build.flash_size = ${common.board_build.flash_size}
board_upload.flash_size = ${common.board_upload.flash_size}
board_upload.maximum_size = ${common.board_upload.maximum_size}
board_build.partitions = ${common.board_build.partitions}
build_flags =
    -D DISPLAY_ST7789
    -D DISPLAY_WIDTH=320
    -D DISPLAY_HEIGHT=240
    -D DISPLAY_ROTATION=1
    -D PIN_LCD_MOSI=11
    -D PIN_LCD_SCK=12
    -D PIN_LCD_CS=10
    -D PIN_LCD_DC=13
    -D PIN_LCD_RST=14
    -D PIN_LCD_BL=3
    -D BLE_DEVICE_NAME=\"CodexPet\"
    -D BOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0

[env:t-display-s3]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
lib_deps = ${common.lib_deps}
board_build.arduino.memory_type = ${common.board_build.arduino.memory_type}
board_build.flash_mode = ${common.board_build.flash_mode}
board_build.f_flash = ${common.board_build.f_flash}
board_build.f_cpu = ${common.board_build.f_cpu}
board_build.psram_type = ${common.board_build.psram_type}
board_build.flash_size = ${common.board_build.flash_size}
board_upload.flash_size = ${common.board_upload.flash_size}
board_upload.maximum_size = ${common.board_upload.maximum_size}
board_build.partitions = ${common.board_build.partitions}
build_flags =
    -D DISPLAY_8080
    -D DISPLAY_WIDTH=320
    -D DISPLAY_HEIGHT=170
    -D DISPLAY_ROTATION=1
    -D PIN_LCD_CS=6
    -D PIN_LCD_RST=5
    -D PIN_LCD_BL=38
    -D PIN_LCD_POWER_ON=15
    -D BLE_DEVICE_NAME=\"CodexPet\"
    -D BOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
