[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = src

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Display / project configuration (MusicGoGoGo wiring)
build_flags =
    -D DISPLAY_ST7789
    -D DISPLAY_WIDTH=320
    -D DISPLAY_HEIGHT=240
    -D DISPLAY_ROTATION=1
    -D PIN_LCD_MOSI=11
    -D PIN_LCD_SCK=12
    -D PIN_LCD_CS=10
    -D PIN_LCD_DC=13
    -D PIN_LCD_RST=14
    -D PIN_LCD_BL=3
    -D BLE_DEVICE_NAME=\"CodexPet\"
    -DCORE_DEBUG_LEVEL=3
